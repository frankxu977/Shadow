[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shadow-camera-watcher"
version = "0.1.0"
description = "Local Windows camera access alerts and history"
requires-python = ">=3.11"
dependencies = ["pystray==0.19.5", "Pillow>=11,<13"]

[project.gui-scripts]
shadow = "shadow.main:main"

[tool.setuptools.packages.find]
where = ["src"]
